[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "backprop-neat-jax"
version = "0.1.0"
description = "Growing neural network topologies with NEAT and Lamarckian backpropagation in JAX"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jax>=0.4.35,<0.13", "optax>=0.2.4,<0.3", "numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
backprop-neat = "backprop_neat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backprop_neat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
